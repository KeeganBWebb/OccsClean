# Run package tests on every push and pull request.
# Intentionally test-only (not full R CMD check) until roxygen help pages exist.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testthat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat
          needs: check

      - name: Run testthat
        run: |
          pkgload::load_all()
          testthat::test_local(stop_on_failure = TRUE)
        shell: Rscript {0}
